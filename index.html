<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>8 Queens</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/styles.css" />
  <script src="./js/functions.js" defer></script>
</head>
<body class="bg-gray-100">
  <h1 class="text-center text-4xl pb-6 pt-4">The 8 Queens Problem</h1>
  <div class="flex items-center justify-center">
    <div class="w-1/2 flex justify-center">
      <table id="board" class="w-3/5 aspect-square border border-gray-300 table-fixed"></table>
    </div>
    <div class="w-1/3 flex flex-col justify-center items-center space-y-4">
      <h2 class="text-center text-lg font-medium">If you can't solve the problem, check one of these solutions</h2>
      <select onchange="showSolution(this.value)" class="p-2 border border-gray-300 rounded">
        <option value="">Normal Mode</option>
        <option value="1">Solución 1</option>
        <option value="2">Solución 2</option>
        <option value="3">Solución 3</option>
      </select>

      <button onclick="clearImages()" class="px-4 py-2 bg-red-500 text-white font-semibold rounded shadow hover:bg-red-600">
        Clear Board
      </button>

      <h3 class="text-center text-md font-medium">Change the queens design</h3>
      <select onchange="changeQueen(this.value)" class="p-2 border border-gray-300 rounded">
        <option value="1">Chess.com Queen</option>
        <option value="2">Queen Elizabeth</option>
        <option value="3">The Queen</option>
      </select>

      <h3 class="text-center text-md font-medium">Change Board Colors</h3>
      <input type="color" id="lightColorPicker" class="w-20 h-10 border rounded" />
      <input type="color" id="darkColorPicker" class="w-20 h-10 border rounded" />
      <button onclick="applyCustomColors()" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
        Apply Custom Colors
      </button>
      <button onclick="resetColors()" class="px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600">
        Reset Colors
      </button>

      <h3 class="text-center text-md font-medium">Blocked Cell Color</h3>
      <input type="color" id="blockedColorPicker" class="w-20 h-10 border rounded" />
      <button onclick="applyBlockedColor()" class="px-4 py-2 bg-purple-500 text-white rounded hover:bg-purple-600">
        Apply Blocked Color
      </button>
    </div>
  </div>
</body>
<footer class="w-full bg-gray-800 text-white py-4 text-center fixed bottom-0">
  <h4 class="text-sm">Developed by Kevin Martínez</h4>
</footer>
</html>
